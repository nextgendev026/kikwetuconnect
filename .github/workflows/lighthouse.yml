name: Lighthouse CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Start server
        run: |
          npx next start -p 3000 &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000/feed; then break; fi
            sleep 2
          done
      - name: Run Lighthouse on feed page
        run: npx lighthouse http://localhost:3000/feed --quiet --chrome-flags="--headless --no-sandbox" --output-path=./lighthouse-feed.json --output=json --only-categories=performance,accessibility,best-practices
      - name: Assert minimum scores
        run: |
          node -e "
            const r = require('./lighthouse-feed.json');
            const cats = r.categories;
            for (const [name, c] of Object.entries(cats)) {
              console.log(name + ': ' + Math.round(c.score * 100));
              if (c.score < 0.6) { console.error('FAIL: ' + name + ' below 60'); process.exit(1); }
            }
          "
      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-report
          path: ./lighthouse-feed.json
          retention-days: 7
